services:
  # PostgreSQL Database Service (Matches Render Managed PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: hostel_postgres
    restart: always
    environment:
      POSTGRES_DB: hostel_db
      POSTGRES_USER: hostel_user
      POSTGRES_PASSWORD: hostel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/schema-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel_user -d hostel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Spring Boot Monolith Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostel_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hostel_db
      SPRING_DATASOURCE_USERNAME: hostel_user
      SPRING_DATASOURCE_PASSWORD: hostel_password
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
