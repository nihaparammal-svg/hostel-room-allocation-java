# ==============================================================================
# Hostel Room Allocation and Vacancy Registration System - Application Properties
# ==============================================================================

spring.application.name=hostel-management-system

# Server Port (Render dynamically assigns PORT)
server.port=${PORT:8080}

# Reverse Proxy / SSL Header support for Render HTTPS termination
server.forward-headers-strategy=framework

# Active Profile: dev (H2 for zero-setup local demo & tests)
# On Render, set SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Upload & Multipart Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.com.college.hostel=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE
