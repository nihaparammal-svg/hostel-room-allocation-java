# ==============================================================================
# Hostel Room Allocation and Vacancy Registration System - Application Properties
# ==============================================================================

spring.application.name=hostel-management-system

# Server Port
server.port=8080

# Active Profile: dev (H2 MySQL-compatibility mode for zero-setup demo & tests)
# Switch to 'mysql' or set SPRING_PROFILES_ACTIVE=mysql for MySQL database
spring.profiles.active=dev

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Upload & Multipart Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.com.college.hostel=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE
