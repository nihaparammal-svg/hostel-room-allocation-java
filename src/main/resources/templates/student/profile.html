<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head('My Profile')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar('profile')}"></header>

    <main class="main-content">
        <div class="container" style="max-width: 720px;">
            
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card" style="box-shadow: var(--shadow-md); padding: 2.25rem;">
                <div class="card-header">
                    <div>
                        <h1 class="card-title" style="font-size: 1.6rem;">Student Profile Information</h1>
                        <p style="font-size: 0.9rem; margin-bottom: 0;">Institutional registration details recorded in the college database.</p>
                    </div>
                    <span class="badge badge-approved" th:if="${student.active}">ACTIVE STUDENT</span>
                    <span class="badge badge-rejected" th:unless="${student.active}">INACTIVE</span>
                </div>

                <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; padding: 1.25rem; background-color: var(--primary-subtle); border-radius: var(--radius-md);">
                    <div style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-accent), var(--purple-main)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 800;">
                        &#127891;
                    </div>
                    <div>
                        <h2 style="font-size: 1.35rem; color: var(--primary-blue); margin-bottom: 0.2rem;" th:text="${student.fullName}">Alex Morgan</h2>
                        <span style="font-weight: 700; color: var(--purple-main); font-size: 0.95rem;" th:text="${student.studentId}">STU2024001</span>
                    </div>
                </div>

                <div class="form-grid" style="margin-bottom: 1.5rem;">
                    <div style="background-color: #f8fafc; padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Email Address</span>
                        <strong th:text="${student.email}">student@hostel.edu</strong>
                    </div>

                    <div style="background-color: #f8fafc; padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Mobile Number</span>
                        <strong th:text="${student.phone}">+1-555-0100</strong>
                    </div>

                    <div style="background-color: #f8fafc; padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Department</span>
                        <strong th:text="${student.department}">Computer Science</strong>
                    </div>

                    <div style="background-color: #f8fafc; padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Year of Study</span>
                        <strong th:text="${student.yearOfStudy}">3rd Year</strong>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <a th:href="@{/student/dashboard}" class="btn btn-primary btn-sm">&larr; Back to Dashboard</a>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
