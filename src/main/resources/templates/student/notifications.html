<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head('Notifications')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar('notifications')}"></header>

    <main class="main-content">
        <div class="container" style="max-width: 800px;">
            
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <div>
                    <h1 style="color: var(--primary-blue); font-size: 1.85rem; margin-bottom: 0.25rem;">Student Notifications</h1>
                    <p style="font-size: 0.95rem; margin-bottom: 0;">System alerts, room status updates, and warden announcements.</p>
                </div>
            </div>

            <div class="card">
                <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; padding: 3rem 1.5rem; color: var(--text-muted);">
                    <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">&#128276;</div>
                    <p style="font-size: 1.1rem; margin-bottom: 0;">No notifications found.</p>
                </div>

                <div th:unless="${#lists.isEmpty(notifications)}" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div th:each="n : ${notifications}" 
                         style="padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background-color: #ffffff; box-shadow: var(--shadow-sm);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 1rem;">
                            <h3 style="font-size: 1.05rem; color: var(--primary-blue); margin-bottom: 0;" th:text="${n.title}">Notification Title</h3>
                            <span style="font-size: 0.8rem; color: var(--text-muted); white-space: nowrap;" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                        </div>
                        <p style="font-size: 0.925rem; color: var(--text-secondary); margin-bottom: 0;" th:text="${n.message}">Notification message body here.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
