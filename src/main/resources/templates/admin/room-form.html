<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head(${isEdit ? 'Edit Room' : 'Add New Room'})}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar('admin-rooms')}"></header>

    <main class="main-content">
        <div class="container" style="max-width: 680px;">
            
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card" style="box-shadow: var(--shadow-md); padding: 2.25rem;">
                <div class="card-header">
                    <div>
                        <h1 class="card-title" th:text="${isEdit ? 'Edit Room Details' : 'Add New Hostel Room'}">Add New Hostel Room</h1>
                        <p style="font-size: 0.9rem; margin-bottom: 0;">Configure room block, floor, capacity, and bed amenities.</p>
                    </div>
                    <a th:href="@{/admin/rooms}" class="btn btn-outline btn-sm">&larr; Back to Rooms</a>
                </div>

                <form th:action="${isEdit ? '/admin/rooms/edit/' + roomId : '/admin/rooms/add'}" 
                      th:object="${roomDto}" method="post">
                    
                    <input type="hidden" th:field="*{id}" th:if="${isEdit}">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="blockId" class="form-label">Hostel Block *</label>
                            <select id="blockId" th:field="*{blockId}" class="form-select" required>
                                <option value="">-- Select Block --</option>
                                <option th:each="block : ${blocks}" 
                                        th:value="${block.id}" 
                                        th:text="${block.blockName} + ' (' + ${block.genderType} + ')'">
                                    Block Name
                                </option>
                            </select>
                            <div th:if="${#fields.hasErrors('blockId')}" th:errors="*{blockId}" class="form-error">Error</div>
                        </div>

                        <div class="form-group">
                            <label for="roomNumber" class="form-label">Room Number *</label>
                            <input type="text" id="roomNumber" th:field="*{roomNumber}" class="form-control" placeholder="e.g. 101, 204A" required>
                            <div th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}" class="form-error">Error</div>
                            <div class="form-hint">Room numbers must be unique within each hostel block.</div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="floor" class="form-label">Floor Number *</label>
                            <input type="number" id="floor" th:field="*{floor}" class="form-control" min="0" max="20" required>
                            <div th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}" class="form-error">Error</div>
                        </div>

                        <div class="form-group">
                            <label for="capacity" class="form-label">Bed Capacity (Total Beds) *</label>
                            <input type="number" id="capacity" th:field="*{capacity}" class="form-control" min="1" max="10" required>
                            <div th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" class="form-error">Error</div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="roomType" class="form-label">Room Type *</label>
                            <select id="roomType" th:field="*{roomType}" class="form-select" required>
                                <option value="">-- Select Configuration --</option>
                                <option value="Single">Single Occupancy</option>
                                <option value="Double">Double Sharing</option>
                                <option value="Triple">Triple Sharing</option>
                                <option value="Dormitory">Dormitory</option>
                            </select>
                            <div th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}" class="form-error">Error</div>
                        </div>

                        <div class="form-group">
                            <label for="monthlyFee" class="form-label">Monthly Fee ($) *</label>
                            <input type="number" step="0.01" id="monthlyFee" th:field="*{monthlyFee}" class="form-control" min="0" required>
                            <div th:if="${#fields.hasErrors('monthlyFee')}" th:errors="*{monthlyFee}" class="form-error">Error</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="facilities" class="form-label">Room Facilities &amp; Amenities (Comma-separated)</label>
                        <input type="text" id="facilities" th:field="*{facilities}" class="form-control" placeholder="e.g. WiFi, AC, Attached Bath, Study Table, Balcony">
                        <div class="form-hint">Separate individual amenities with commas.</div>
                    </div>

                    <div class="form-group">
                        <label for="status" class="form-label">Operational Status *</label>
                        <select id="status" th:field="*{status}" class="form-select" required>
                            <option value="AVAILABLE">Available for Allocation</option>
                            <option value="FULL">Marked as Full</option>
                            <option value="MAINTENANCE">Under Maintenance / Repairs</option>
                        </select>
                    </div>

                    <div style="margin-top: 1.75rem; display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">
                            <span th:text="${isEdit ? '&#10004; Update Room' : '&#43; Create Room'}">Save</span>
                        </button>
                        <a th:href="@{/admin/rooms}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>

            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
