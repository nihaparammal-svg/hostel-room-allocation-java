# ==============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# Web Service (Java 21 Spring Boot Monolith) + Render Managed PostgreSQL
# ==============================================================================

version: "1"

services:
  # 1. Java Spring Boot Web Service
  - type: web
    name: hostel-room-allocation
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /auth/login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-postgres-db
          property: connectionString

databases:
  # 2. Render Managed PostgreSQL Database
  - name: hostel-postgres-db
    databaseName: hostel_db
    user: hostel_user
    plan: free
    region: oregon
